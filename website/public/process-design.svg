<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Process design do dev-metrics: ciclo de sync agendado, do disparo do scheduler até o sleep, com tratamento de erro registrado em integration_logs">
  <defs>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="ahe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="498" rx="14" fill="#09090b" stroke="#27272a"/>

  <text x="32" y="42" fill="#f4f4f5" font-size="20" font-weight="700" letter-spacing="-0.01em">Process Design</text>
  <text x="32" y="64" fill="#71717a" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ciclo de sync agendado &#183; um coletor</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- Row 1 (left to right) -->
    <rect x="32" y="100" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="48" y="124" fill="#34d399" font-size="11" font-weight="700">1 &#183; SCHEDULE</text>
    <text x="48" y="146" fill="#a1a1aa" font-size="11">schedule dispara</text>
    <text x="48" y="164" fill="#71717a" font-size="11">cada 6h / 4h</text>

    <rect x="247" y="100" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="263" y="124" fill="#34d399" font-size="11" font-weight="700">2 &#183; ESTADO</text>
    <text x="263" y="146" fill="#a1a1aa" font-size="11">lê sync_state</text>
    <text x="263" y="164" fill="#71717a" font-size="11">last_synced_at</text>

    <rect x="462" y="100" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="478" y="124" fill="#34d399" font-size="11" font-weight="700">3 &#183; EXTRACT</text>
    <text x="478" y="146" fill="#a1a1aa" font-size="11">páginas novas</text>
    <text x="478" y="164" fill="#71717a" font-size="11">da REST API</text>

    <rect x="677" y="100" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="693" y="124" fill="#34d399" font-size="11" font-weight="700">4 &#183; TRANSFORM</text>
    <text x="693" y="146" fill="#a1a1aa" font-size="11">normaliza +</text>
    <text x="693" y="164" fill="#71717a" font-size="11">calcula métricas</text>

    <!-- Row 2 (right to left) -->
    <rect x="677" y="270" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="693" y="294" fill="#34d399" font-size="11" font-weight="700">5 &#183; LOAD</text>
    <text x="693" y="316" fill="#a1a1aa" font-size="11">UPSERT no</text>
    <text x="693" y="334" fill="#71717a" font-size="11">PostgreSQL</text>

    <rect x="462" y="270" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="478" y="294" fill="#34d399" font-size="11" font-weight="700">6 &#183; REGISTRO</text>
    <text x="478" y="316" fill="#a1a1aa" font-size="11">grava o run em</text>
    <text x="478" y="334" fill="#71717a" font-size="10">integration_sync_runs</text>

    <rect x="247" y="270" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="263" y="294" fill="#34d399" font-size="11" font-weight="700">7 &#183; CHECKPOINT</text>
    <text x="263" y="316" fill="#a1a1aa" font-size="11">atualiza</text>
    <text x="263" y="334" fill="#71717a" font-size="11">sync_state</text>

    <rect x="32" y="270" width="172" height="78" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="48" y="294" fill="#34d399" font-size="11" font-weight="700">8 &#183; SLEEP</text>
    <text x="48" y="316" fill="#a1a1aa" font-size="11">aguarda o</text>
    <text x="48" y="334" fill="#71717a" font-size="11">próximo ciclo</text>

    <!-- Error box -->
    <rect x="300" y="412" width="316" height="60" rx="8" fill="#1a1113" stroke="#f87171" stroke-dasharray="5 3"/>
    <text x="320" y="438" fill="#f87171" font-size="11" font-weight="700">EXCEÇÃO</text>
    <text x="320" y="458" fill="#fca5a5" font-size="11">db_logger &#8594; integration_logs (ERROR) &#183; segue ciclo</text>
  </g>

  <!-- Flow arrows -->
  <g fill="none" stroke="#34d399" stroke-width="1.6">
    <path d="M204 139 L243 139" marker-end="url(#ahp)"/>
    <path d="M419 139 L458 139" marker-end="url(#ahp)"/>
    <path d="M634 139 L673 139" marker-end="url(#ahp)"/>
    <path d="M763 178 L763 266" marker-end="url(#ahp)"/>
    <path d="M677 309 L638 309" marker-end="url(#ahp)"/>
    <path d="M462 309 L423 309" marker-end="url(#ahp)"/>
    <path d="M247 309 L208 309" marker-end="url(#ahp)"/>
    <path d="M118 270 L118 182" marker-end="url(#ahp)"/>
  </g>
  <text x="126" y="232" fill="#71717a" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">loop</text>

  <!-- Error arrow -->
  <path d="M720 348 C720 400, 560 400, 480 410" fill="none" stroke="#f87171" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ahe)"/>
</svg>
